[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vestibular"
version = "0.1.0"
description = "Mineração de questões de vestibulares (USP/FUVEST, UNESP, UNICAMP, UNIVESP)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "click>=8.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "streamlit>=1.36",
    "fsrs>=6.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
mcp = ["fastapi>=0.115", "mcp>=1.2,<2", "uvicorn>=0.30"]
dev = ["ruff>=0.6"]

[project.scripts]
vestibular = "scripts.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vestibular*", "scripts*"]
namespaces = false
